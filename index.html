<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1" />
<meta name="theme-color" content="#0E5C63" id="metaTema" />
<meta name="description" content="Pedidos dos quiosques direto na recepção." />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Pedidos Lagoa" />
<title>Pedidos Lagoa</title>
<link rel="manifest" href="./manifest.webmanifest" />
<link rel="icon" href="./icons/icon-192.png" />
<link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
<link rel="stylesheet" href="./styles.css?v=10" />
</head>
<body>

<!-- ============ TELA DE LOGIN ============ -->
<div class="login-screen" id="loginScreen" hidden>
  <div class="login-box">
    <img class="login-logo" src="./icons/icon-192.png" alt="" />
    <h1 class="login-tit" id="loginMarca">Pedidos Lagoa</h1>
    <p class="login-sub" id="loginSub">Lagoa</p>

    <form class="login-form" id="loginForm" autocomplete="on">
      <label class="field">
        <span>Usuário</span>
        <input id="loginUsuario" type="text" autocomplete="username" autocapitalize="none"
               spellcheck="false" placeholder="recepcao, adm ou quiosque7" required />
      </label>
      <div class="login-dicas" id="loginDicas"></div>
      <label class="field">
        <span>Senha</span>
        <input id="loginSenha" type="password" autocomplete="current-password"
               placeholder="sua senha" required />
      </label>
      <button type="submit" class="btn btn-primary btn-big" id="loginBtn">Entrar</button>
      <p class="form-msg" id="loginMsg" role="status"></p>
    </form>

    <p class="login-rodape" id="loginRodape"></p>
  </div>
</div>

<!-- ============ APP ============ -->
<div id="app" hidden>

  <div class="faixa-topo" id="faixaEstado" hidden></div>

  <header class="topbar">
    <div class="brand">
      <img class="brand-logo" id="brandLogo" src="./icons/icon-192.png" alt="" />
      <div class="brand-txt">
        <strong id="brandNome">Pedidos Lagoa</strong>
        <span class="brand-sub" id="brandSub">Lagoa</span>
      </div>
    </div>

    <div class="topbar-right">
      <span class="contador" id="contadorTopo" hidden></span>
      <div class="viewswitch" id="telasBtns" role="tablist" aria-label="Telas"></div>
      <button id="cfgTelaBtn" class="icon-btn-h" title="Configurar esta aba"
              aria-label="Configurar esta aba" hidden>⚙️</button>
      <button id="cfgGeralBtn" class="icon-btn-h" title="Configurações gerais"
              aria-label="Configurações gerais" hidden>🛠️</button>
      <span class="quem" id="quemSou" hidden></span>
      <button id="sairBtn" class="pill-btn" title="Sair" hidden>Sair</button>
    </div>
  </header>

  <main class="content" id="conteudo"></main>
</div>

<!-- barra do carrinho, pop-ups e avisos são criados pelo programa -->
<div id="rodapeFixo"></div>
<div id="modais"></div>
<div class="toasts" id="toasts" aria-live="polite"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="./config.js?v=10"></script>
<script src="./qr.js?v=10"></script>
<script src="./app.js?v=10"></script>
<script src="./quiosque.js?v=10"></script>
<script src="./propaganda.js?v=10"></script>
<script src="./recepcao.js?v=10"></script>
<script src="./admin.js?v=10"></script>
<script>PL.iniciar();</script>
</body>
</html>
